<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Wild Rift Flash Timer Tracker - Mobile & Desktop</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
    }

    body {
      background-color: #131926;
      color: #f1f5f9;
      display: flex;
      justify-content: center;
      padding: 16px;
      min-height: 100vh;
    }

    body.pseudo-fullscreen {
      padding: 8px;
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      overflow-y: auto;
      z-index: 9999;
      background-color: #0b111e;
    }

    .container {
      width: 100%;
      max-width: 720px;
      background-color: #131c2e;
      border: 1px solid #1e293b;
      border-radius: 12px;
      padding: 18px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.45);
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 12px;
      margin-bottom: 16px;
    }

    .header-title h1 {
      font-size: 1.25rem;
      font-weight: 700;
      color: #f8fafc;
      margin-bottom: 4px;
    }


    .header-actions {
      display: flex;
      gap: 8px;
      flex-shrink: 0;
    }

    .btn {
      border: none;
      border-radius: 8px;
      padding: 8px 14px;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.15s ease, transform 0.1s ease;
      touch-action: manipulation;
    }

    .btn:active {
      transform: scale(0.97);
    }

    .btn-fullscreen {
      background-color: #334155;
      color: #f8fafc;
      border: 1px solid #475569;
    }

    .btn-fullscreen:hover {
      background-color: #475569;
    }

    .btn-copy {
      background-color: #2563eb;
      color: #ffffff;
    }

    .btn-copy:hover {
      background-color: #1d4ed8;
    }

    .clock-card {
      background-color: #1a2436;
      border: 1px solid #263349;
      border-radius: 10px;
      padding: 14px 16px;
      margin-bottom: 16px;
    }

    .clock-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
      margin-bottom: 12px;
    }

    .clock-display {
      display: flex;
      align-items: baseline;
      gap: 10px;
    }

    .clock-label {
      font-size: 0.8rem;
      font-weight: 700;
      letter-spacing: 0.05em;
      color: #94a3b8;
      text-transform: uppercase;
    }

    .clock-value {
      font-size: 2rem;
      font-weight: 800;
      color: #ffffff;
      font-variant-numeric: tabular-nums;
    }

    .clock-controls {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .btn-start {
      background-color: #10b981;
      color: #052e16;
    }

    .btn-start.running {
      background-color: #f59e0b;
      color: #451a03;
    }

    .btn-adjust {
      background-color: #334155;
      color: #f1f5f9;
    }

    .btn-reset {
      background-color: #993b3b;
      color: #fecaca;
    }

    .clock-manual {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.85rem;
      color: #94a3b8;
    }

    .clock-manual input {
      width: 54px;
      padding: 6px 8px;
      background-color: #0f172a;
      border: 1px solid #334155;
      border-radius: 6px;
      color: #f8fafc;
      text-align: center;
      font-size: 0.85rem;
      font-weight: 600;
    }

    .clock-manual input:focus {
      outline: none;
      border-color: #3b82f6;
    }

    .btn-set {
      background-color: #475569;
      color: #f8fafc;
      padding: 6px 14px;
    }

    .table-header {
      display: grid;
      grid-template-columns: 1.05fr 1.65fr 0.75fr;
      padding: 0 14px 8px 14px;
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 0.05em;
      color: #94a3b8;
      text-transform: uppercase;
    }

    .table-header span:nth-child(2) {
      text-align: center;
    }

    .table-header span:nth-child(3) {
      text-align: right;
    }

    .role-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 16px;
    }

    .role-row {
      display: grid;
      grid-template-columns: 1.05fr 1.65fr 0.75fr;
      align-items: center;
      background-color: #1a2436;
      border: 1px solid #263349;
      border-radius: 10px;
      padding: 10px 14px;
      min-height: 60px;
      transition: border-color 0.2s ease, background-color 0.2s ease;
    }

    .role-row.active {
      border-color: #b45309;
      background-color: #1e2334;
    }

    .role-btn {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      background-color: #263349;
      border: 1px solid #334155;
      border-radius: 8px;
      padding: 8px 12px;
      color: #f8fafc;
      font-size: 0.9rem;
      font-weight: 700;
      cursor: pointer;
      width: 100%;
      max-width: 155px;
      text-align: left;
      touch-action: manipulation;
    }

    .role-btn:hover {
      background-color: #334155;
    }

    .role-key {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 22px;
      height: 22px;
      background-color: #0f172a;
      border-radius: 5px;
      font-size: 0.78rem;
      color: #94a3b8;
      flex-shrink: 0;
    }

    /* Middle cell keeps timer centered and positions -5s / +5s to its left without shifting anything */
    .flash-cell {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
    }

    .flash-adjust-group {
      position: absolute;
      left: calc(50% + 44px);
      display: flex;
      gap: 4px;
      white-space: nowrap;
    }

    .flash-adjust-group.hidden {
      display: none;
    }

    .btn-mini {
      background-color: #293548;
      border: 1px solid #475569;
      color: #e2e8f0;
      border-radius: 6px;
      padding: 4px 6px;
      font-size: 0.72rem;
      font-weight: 700;
      cursor: pointer;
      touch-action: manipulation;
    }

    .btn-mini:hover {
      background-color: #3b4b63;
    }

    .btn-mini:active {
      transform: scale(0.95);
    }

    .flash-badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 74px;
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 0.9rem;
      font-weight: 800;
      font-variant-numeric: tabular-nums;
      cursor: pointer;
      user-select: none;
    }

    .flash-badge.ready {
      background-color: #064e3b;
      color: #34d399;
      border: 1px solid #047857;
    }

    .flash-badge.cooldown {
      background-color: #7f1d1d;
      color: #34d399;
      border: 1px solid #991b1b;
    }

    .ready-at {
      text-align: right;
      font-size: 1rem;
      font-weight: 800;
      font-variant-numeric: tabular-nums;
      color: #64748b;
    }

    .ready-at.active {
      color: #f59e0b;
    }

    .chat-box {
      background-color: #1a2436;
      border: 1px solid #263349;
      border-radius: 10px;
      padding: 12px 14px;
      margin-bottom: 12px;
    }

    .chat-label {
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 0.05em;
      color: #94a3b8;
      text-transform: uppercase;
      margin-bottom: 4px;
    }

    .chat-output {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 0.9rem;
      font-weight: 700;
      color: #FFD700;
      word-break: break-word;
    }

    .objectives {
      text-align: center;
      font-size: 0.78rem;
      color: #cbd5e1;
      line-height: 1.5;
    }

    @media (max-width: 480px) {
      .container {
        padding: 12px;
      }
      .role-row {
        padding: 8px 10px;
        grid-template-columns: 1.05fr 1.65fr 0.75fr;
      }
      .role-btn {
        padding: 7px 8px;
        font-size: 0.82rem;
        gap: 6px;
        max-width: 118px;
      }
      .flash-badge {
        min-width: 64px;
        padding: 5px 8px;
        font-size: 0.85rem;
      }
      .flash-adjust-group {
        right: calc(50% + 36px);
        gap: 3px;
      }
      .btn-mini {
        padding: 4px 5px;
        font-size: 0.68rem;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <div class="header-title">
        <h1>WR Flash Tracker</h1>
      </div>
      <div class="header-actions">
        <button type="button" class="btn btn-fullscreen" id="fullscreenBtn" onclick="toggleFullScreen()">Full Screen</button>
        <button type="button" class="btn btn-copy" id="copyBtn" onclick="copyTimers()">Copy Timers</button>
      </div>
    </div>

    <div class="clock-card">
      <div class="clock-top">
        <div class="clock-display">
          <span class="clock-label">GAME TIME</span>
          <span class="clock-value" id="gameClock">0:00</span>
        </div>
        <div class="clock-controls">
          <button type="button" class="btn btn-start" id="startBtn" onclick="toggleClock()">Start</button>
          <button type="button" class="btn btn-adjust" onclick="adjustGameTime(-1)">-1s</button>
          <button type="button" class="btn btn-adjust" onclick="adjustGameTime(1)">+1s</button>
          <button type="button" class="btn btn-reset" onclick="resetAll()">Reset</button>
        </div>
      </div>

      <div class="clock-manual">
        <span>Set Time:</span>
        <input type="number" id="inputMin" placeholder="MM" min="0" max="99" inputmode="numeric" />
        <span>:</span>
        <input type="number" id="inputSec" placeholder="SS" min="0" max="59" inputmode="numeric" />
        <button type="button" class="btn btn-set" onclick="setManualTime()">Set</button>
      </div>
    </div>

    <div class="table-header">
      <span>ROLE</span>
      <span>FLASH</span>
      <span>READY AT</span>
    </div>

    <div class="role-list" id="roleList"></div>

    <div class="chat-box">
      <div class="chat-label">CHAT OUTPUT</div>
      <div class="chat-output" id="chatOutput">All Flashes Ready</div>
    </div>

    <div class="objectives">
      (DR &amp; RH: 6:00) (BR: 11:00) (Enhanced Buff Share: 12:00) (Nexus Shield Expiration: 16:00)
    </div>
  </div>

  <script>
    var FLASH_COOLDOWN = 150;
    var roles = [
      { key: "1", name: "TOP", remaining: 0, readyAt: null },
      { key: "2", name: "JG", remaining: 0, readyAt: null },
      { key: "3", name: "MID", remaining: 0, readyAt: null },
      { key: "4", name: "ADC", remaining: 0, readyAt: null },
      { key: "5", name: "SUP", remaining: 0, readyAt: null }
    ];

    var gameSeconds = 0;
    var clockRunning = false;
    var intervalId = null;

    function formatTime(totalSecs) {
      var secs = Math.max(0, Math.floor(totalSecs));
      var m = Math.floor(secs / 60);
      var s = secs % 60;
      return m + ":" + (s < 10 ? "0" : "") + s;
    }

    function buildRows() {
      var list = document.getElementById("roleList");
      var html = "";
      for (var i = 0; i < roles.length; i++) {
        html += '' +
          '<div class="role-row" id="row-' + i + '">' +
            '<div>' +
              '<button type="button" class="role-btn" onclick="toggleFlash(' + i + ')">' +
                '<span class="role-key">' + roles[i].key + '</span>' +
                '<span>' + roles[i].name + '</span>' +
              '</button>' +
            '</div>' +
            '<div class="flash-cell">' +
              '<div class="flash-adjust-group hidden" id="adjust-' + i + '">' +
                '<button type="button" class="btn-mini" onclick="adjustFlash(' + i + ', -5)">-5s</button>' +
                '<button type="button" class="btn-mini" onclick="adjustFlash(' + i + ', 5)">+5s</button>' +
              '</div>' +
              '<span class="flash-badge ready" id="badge-' + i + '" onclick="toggleFlash(' + i + ')">READY</span>' +
            '</div>' +
            '<div class="ready-at" id="ready-' + i + '">--:--</div>' +
          '</div>';
      }
      list.innerHTML = html;
    }

    function updateUI() {
      document.getElementById("gameClock").textContent = formatTime(gameSeconds);
      var chatParts = [];

      for (var i = 0; i < roles.length; i++) {
        var role = roles[i];
        var rowEl = document.getElementById("row-" + i);
        var badgeEl = document.getElementById("badge-" + i);
        var readyEl = document.getElementById("ready-" + i);
        var adjustEl = document.getElementById("adjust-" + i);

        if (role.remaining > 0) {
          rowEl.classList.add("active");
          badgeEl.className = "flash-badge cooldown";
          badgeEl.textContent = formatTime(role.remaining);
          readyEl.className = "ready-at active";
          readyEl.textContent = formatTime(role.readyAt);
          adjustEl.classList.remove("hidden");
          chatParts.push(role.name + " F " + formatTime(role.readyAt));
        } else {
          rowEl.classList.remove("active");
          badgeEl.className = "flash-badge ready";
          badgeEl.textContent = "READY";
          readyEl.className = "ready-at";
          readyEl.textContent = "--:--";
          adjustEl.classList.add("hidden");
        }
      }

      document.getElementById("chatOutput").textContent =
        chatParts.length > 0 ? chatParts.join(" | ") : "All Flashes Ready";
    }

    function toggleFlash(index) {
      var role = roles[index];
      if (role.remaining > 0) {
        role.remaining = 0;
        role.readyAt = null;
      } else {
        role.remaining = FLASH_COOLDOWN;
        role.readyAt = gameSeconds + FLASH_COOLDOWN;
      }
      updateUI();
    }

    function adjustFlash(index, delta) {
      var role = roles[index];
      if (role.remaining <= 0) return;
      var nextRemaining = role.remaining + delta;
      if (nextRemaining <= 0) {
        role.remaining = 0;
        role.readyAt = null;
      } else {
        role.remaining = nextRemaining;
        role.readyAt = gameSeconds + nextRemaining;
      }
      updateUI();
    }

    function tick() {
      gameSeconds++;
      for (var i = 0; i < roles.length; i++) {
        if (roles[i].remaining > 0) {
          roles[i].remaining--;
          if (roles[i].remaining <= 0) {
            roles[i].remaining = 0;
            roles[i].readyAt = null;
          }
        }
      }
      updateUI();
    }

    function toggleClock() {
      var btn = document.getElementById("startBtn");
      if (clockRunning) {
        clearInterval(intervalId);
        clockRunning = false;
        btn.textContent = "Start";
        btn.classList.remove("running");
      } else {
        clockRunning = true;
        btn.textContent = "Pause";
        btn.classList.add("running");
        intervalId = setInterval(tick, 1000);
      }
    }

    function adjustGameTime(delta) {
      var prevSeconds = gameSeconds;
      gameSeconds = Math.max(0, gameSeconds + delta);
      var actualDelta = gameSeconds - prevSeconds;
      for (var i = 0; i < roles.length; i++) {
        if (roles[i].remaining > 0 && roles[i].readyAt !== null) {
          roles[i].readyAt = Math.max(0, roles[i].readyAt + actualDelta);
        }
      }
      updateUI();
    }

    function setManualTime() {
      var minVal = parseInt(document.getElementById("inputMin").value, 10) || 0;
      var secVal = parseInt(document.getElementById("inputSec").value, 10) || 0;
      if (minVal < 0) minVal = 0;
      if (secVal < 0) secVal = 0;
      if (secVal > 59) secVal = 59;

      var newSeconds = minVal * 60 + secVal;
      var diff = newSeconds - gameSeconds;
      gameSeconds = newSeconds;

      for (var i = 0; i < roles.length; i++) {
        if (roles[i].remaining > 0 && roles[i].readyAt !== null) {
          roles[i].readyAt = Math.max(0, roles[i].readyAt + diff);
        }
      }
      updateUI();
    }

    function resetAll() {
      if (clockRunning) {
        clearInterval(intervalId);
        clockRunning = false;
      }
      var btn = document.getElementById("startBtn");
      btn.textContent = "Start";
      btn.classList.remove("running");

      gameSeconds = 0;
      for (var i = 0; i < roles.length; i++) {
        roles[i].remaining = 0;
        roles[i].readyAt = null;
      }
      document.getElementById("inputMin").value = "";
      document.getElementById("inputSec").value = "";
      updateUI();
    }

    function copyTimers() {
      var text = document.getElementById("chatOutput").textContent;
      var copyBtn = document.getElementById("copyBtn");
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(function() {
          copyBtn.textContent = "Copied!";
          setTimeout(function() { copyBtn.textContent = "Copy Timers"; }, 1400);
        });
      } else {
        var temp = document.createElement("textarea");
        temp.value = text;
        document.body.appendChild(temp);
        temp.select();
        document.execCommand("copy");
        document.body.removeChild(temp);
        copyBtn.textContent = "Copied!";
        setTimeout(function() { copyBtn.textContent = "Copy Timers"; }, 1400);
      }
    }

    function toggleFullScreen() {
      var doc = window.document;
      var docEl = doc.documentElement;
      var reqFS = docEl.requestFullscreen || docEl.mozRequestFullScreen || docEl.webkitRequestFullScreen || docEl.msRequestFullscreen;
      var exitFS = doc.exitFullscreen || doc.mozCancelFullScreen || doc.webkitExitFullscreen || doc.msExitFullscreen;

      if (!doc.fullscreenElement && !doc.mozFullScreenElement && !doc.webkitFullscreenElement && !doc.msFullscreenElement) {
        if (reqFS) {
          reqFS.call(docEl).catch(function() {
            document.body.classList.toggle("pseudo-fullscreen");
          });
        } else {
          document.body.classList.toggle("pseudo-fullscreen");
        }
      } else {
        if (exitFS) {
          exitFS.call(doc);
        }
        document.body.classList.remove("pseudo-fullscreen");
      }
    }

    document.addEventListener("keydown", function(e) {
      var tag = e.target.tagName.toLowerCase();
      if (tag === "input" || tag === "textarea") {
        if (e.key === "Enter") {
          setManualTime();
          e.target.blur();
        }
        return;
      }
      if (e.key >= "1" && e.key <= "5") {
        var idx = parseInt(e.key, 10) - 1;
        toggleFlash(idx);
      }
    });

    buildRows();
    updateUI();
  </script>
</body>
</html>
